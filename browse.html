<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Products - EcoDrop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <div class="logo">EcoDrop</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="browse.html" class="active">PRODUCTS</a>
            <a href="history.html">HISTORY</a>
            <a href="about.html">ABOUT</a>
        </nav>
        <div class="nav-right">
            <a href="post.html" class="btn-green">+ Post Item</a>
        </div>
    </header>

    <main>
        <section class="listings-container">
            <h2>Available Listings</h2>

            <div class="controls-bar">
                <input type="text" id="search-input" class="search-input" placeholder="Search items by title or location...">
                
                <div class="filter-box">
                    <select id="filter-select">
                        <option value="All">All Categories</option>
                        <option value="E-Waste">E-Waste</option>
                        <option value="Plastics">Plastics</option>
                        <option value="Metals">Metals</option>
                        <option value="Glass">Glass</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div id="item-grid" class="item-grid"></div>
        </section>
    </main>

    <footer>
        <div class="social-icons">
            <a href="https://www.facebook.com/" target="_blank"><i class="fa fa-facebook-official"></i></a>
            <a href="https://www.twitter.com/" target="_blank"><i class="fa fa-twitter"></i></a>
            <a href="https://www.instagram.com/" target="_blank"><i class="fa fa-instagram"></i></a>
        </div>
        <p>&copy; 2026 EcoDrop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
