<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access - EcoDrop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .form-container {
            max-width: 420px !important;
            margin: 50px auto !important;
        }
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbdcd1;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">EcoDrop</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="browse.html">PRODUCTS</a>
            <a href="history.html">HISTORY</a>
            <a href="about.html">ABOUT</a>
        </nav>
        <div class="nav-right">
        </div>
    </header>

    <main>
        <section class="form-container">
            <h2 id="auth-title">Sign Up to Post</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="auth-email">Email Address:</label>
                    <input type="email" id="auth-email" placeholder="e.g. user@gmail.com" required>
                </div>
                
                <div class="form-group">
                    <label for="auth-pass">Password:</label>
                    <input type="password" id="auth-pass" placeholder="Enter password" required>
                </div>

                <button type="submit" id="auth-submit-btn" class="btn-green" style="width: 100%;">Create Account</button>
            </form>
            <p style="margin-top: 20px; font-size: 13px; text-align: center;">
                <span id="toggle-text">Already have an account?</span> 
                <a href="#" id="toggle-auth-mode" style="color: #1f7a4c; font-weight: bold;">Login here</a>
            </p>
        </section>
    </main>

    <footer>
        <div class="social-icons">
            <a href="https://www.facebook.com/" target="_blank"><i class="fa fa-facebook-official"></i></a>
            <a href="https://www.twitter.com/" target="_blank"><i class="fa fa-twitter"></i></a>
            <a href="https://www.instagram.com/" target="_blank"><i class="fa fa-instagram"></i></a>
        </div>
        <p>&copy; 2026 EcoDrop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    
</body>
</html>
