<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post an Item - EcoDrop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <div class="logo">EcoDrop</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="browse.html">PRODUCTS</a>
            <a href="history.html">HISTORY</a>
            <a href="about.html">ABOUT</a>
        </nav>
        <div class="nav-right">
            <a href="post.html" class="btn-green active">+ Post Item</a>
        </div>
    </header>

    <main>
        <section class="form-container">
            <h2>Post an Item Form</h2>
            <form id="item-form">
                <div class="form-group">
                    <label for="item-title">Item Title:</label>
                    <input type="text" id="item-title" placeholder="e.g. Old Laptop Batteries, Plastic Bottles" required>
                </div>

                <div class="form-group">
                    <label for="item-cat">Category:</label>
                    <select id="item-cat" required>
                        <option value="E-Waste">E-Waste</option>
                        <option value="Plastics">Plastics</option>
                        <option value="Metals">Metals</option>
                        <option value="Glass">Glass</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-phone">Phone Number:</label>
                    <input type="tel" id="item-phone" placeholder="e.g. 0712345678" required>
                </div>

                <div class="form-group">
                    <label for="item-email">Email Address:</label>
                    <input type="email" id="item-email" placeholder="e.g. example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="item-desc">Item Description:</label>
                    <textarea id="item-desc" rows="3" placeholder="Provide details about the item..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="item-location">Pickup Location:</label>
                    <input type="text" id="item-location" placeholder="e.g. Westlands Estate - Gate 2" required>
                </div>

                <div class="form-group">
                    <label for="item-img">Item Image (Optional):</label>
                    <input type="file" id="item-img" accept="image/*">
                </div>

                <button type="submit" id="add-btn" class="btn-green">Post Item</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="social-icons">
            <a href="https://www.facebook.com/" target="_blank"><i class="fa fa-facebook-official"></i></a>
            <a href="https://www.twitter.com/" target="_blank"><i class="fa fa-twitter"></i></a>
            <a href="https://www.instagram.com/" target="_blank"><i class="fa fa-instagram"></i></a>
        </div>
        <p>&copy; 2026 EcoDrop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
